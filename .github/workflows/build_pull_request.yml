on:
  pull_request_target:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions: 
  actions: read
  attestations: read
  checks: read
  contents: read
  deployments: read
  id-token: none
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  security-events: read
  statuses: read

jobs:
  build_internal_pull:
    uses: graycoreio/daffodil/.github/workflows/build.yml@main
    if: github.event.pull_request.head.repo.full_name == github.repository
    with: 
      cache-mode: 'read-only'
    secrets:
      NX_KEY: ${{ secrets.NX_KEY }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_NX_CACHE_READONLY_CONNECTION_STRING }}
  build_fork_pull:
    uses: graycoreio/daffodil/.github/workflows/build.yml@main
    if: github.event.pull_request.head.repo.full_name != github.repository
    with: 
      cache-mode: 'read-only'
    secrets:
      NX_KEY: ${{ secrets.NX_KEY }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_NX_CACHE_READONLY_CONNECTION_STRING }}

  
